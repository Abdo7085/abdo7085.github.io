<line class="l" x1="265" y1="176" x2="265" y2="248" marker-end="url(#a)"/>
<line class="l" x1="415" y1="176" x2="415" y2="248" marker-end="url(#a)"/>
<line class="l" x1="565" y1="176" x2="565" y2="248" marker-end="url(#a)"/>
<g class="g"><rect x="50" y="250" width="130" height="56" rx="8"/><text class="h" x="115" y="268">صفحة مشروع</text><text class="s" x="115" y="288">الشارات = روابط</text></g>
<g class="g"><rect x="200" y="250" width="130" height="56" rx="8"/><text class="h" x="265" y="268">صفحة منتج</text><text class="s" x="265" y="288">الشارات = روابط</text></g>
<g class="n"><rect x="350" y="250" width="130" height="56" rx="8"/><text class="h" x="415" y="268">صفحة بروتوكول</text><text class="s" x="415" y="288">وصف + منتجات</text></g>
