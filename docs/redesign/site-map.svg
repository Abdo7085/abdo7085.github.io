<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 680 420" font-family="Segoe UI, Tahoma, Arial, sans-serif">
<title>خريطة الموقع بعد إضافة البروتوكولات والمقالات</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.g rect{fill:#F1EFE8;stroke:#888780}.g .h{fill:#2C2C2A}.g .s{fill:#5F5E5A}
.n rect{fill:#E1F5EE;stroke:#0F6E56}.n .h{fill:#04342C}.n .s{fill:#0F6E56}
.h{font-size:14px;font-weight:600}.s{font-size:12px}
.l{stroke:#888780;stroke-width:1.2;fill:none}
.x{stroke:#1D9E75;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
text{text-anchor:middle;dominant-baseline:central}
</style>
</defs>
<rect width="680" height="420" fill="#ffffff"/>
<g class="g"><rect x="270" y="30" width="140" height="44" rx="8"/><text class="h" x="340" y="52">الصفحة الرئيسية</text></g>
